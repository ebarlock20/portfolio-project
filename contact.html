<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"

    ></script>
    <script
      src="https://kit.fontawesome.com/ddc3ee268a.js"
      crossorigin="anonymous"
    ></script>

    <meta
      name="description"
      content="Emma is a front-end developer based in the United States."
    />
    <title>Contact Emma Barber</title>
  </head>
  <body>
    <div class="container">
      <nav class="d-flex justify-content-between">
        <a href="/" title="Homepage">
          <img
            src="images/logo.png"
            class="logo d-none d-md-block"
            alt="Emma Logo"
          />
          <img
            src="images/logo-small.png"
            class="logo d-block d-md-none"
            alt="Emma Logo"
          />
        </a>
        <ul>
          <li><a href="/" title="Homepage">Home</a></li>
          <li><a href="/about.html" title="About Emma">About</a></li>
          <li><a href="/work.html" title="Emma's Work">Work</a></li>
          <li class="active">
            <a href="/contact.html" title="Contact Emma">Contact</a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="content-container container">
      <div class="content">
        <h1 class="mb-5">Let's get in touch!</h1>
        <div class="row">
          <div class="col-md-8">
            <form
              action="https://formspree.io/f/mnqvowqk"
              method="POST"
              class="border p-3 rounded mb-3"
            >
              <div class="mb-3">
                <label class="form-label">Your email: </label>
                <input
                  type="email"
                  name="_replyto"
                  class="form-control"
                  required
                  autofocus
                />
              </div>
              <div class="mb-3">
                <label class="form-label"> Subject: </label>
                <textarea
                  name="subject"
                  class="form-control"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea
                  class="form-control"
                  id="message"
                  name="message"
                  rows="5"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn btn-branding">Send</button>
            </form>
          </div>
          <div class="col-md-4">
            <h3>Email</h3>
            <p>
              <a href="mailto:ebarlock20@gmail.com"> ebarlock20@gmail.com</a>
            </p>
            <h3>Github</h3>
            <p>
              <a href="https://github.com/ebarlock20" target="_blank"
                >ebarlock20</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="contact-box justify-content-between mb-5 d-none d-md-flex">
        <div>
          <h3>Work Inquiry</h3>
          <p class="text-muted">Let's work together!</p>
        </div>
        <div>
          <a href="/contact.html" class="btn btn-branding mt-3">Contact Me</a>
        </div>
      </div>
      <div class="d-flex justify-content-center mb-5">
        <a
          href="mailto:ebarlock20@gmail.com"
          class="email-link"
          title="Email Emma"
        >
          ebarlock20@gmail.com
        </a>
      </div>
      <hr />
      <div class="social-links text-center">
        <a href="https://instagram.com/emma.b.1992" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://github.com/ebarlock20" target="_blank"
          ><i class="fab fa-github"></i
        ></a>
        <a href="https://facebook.com/emma.barber.416439" target="_blank"
          ><i class="fab fa-facebook"></i
        ></a>
      </div>
      <p class="text-center mt-5">
        This project was coded by Emma Barber and it is
        <a
          href="https://github.com/ebarlock20/portfolio-project"
          target="_blank"
          >open source</a
        >
      </p>
    </footer>
  </body>
</html>
